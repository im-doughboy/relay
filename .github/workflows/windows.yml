# Builds Relay for Windows on GitHub's machines, the same way as
# packaging/package-windows.sh does on your own computer (MSYS2 UCRT64).
#
# - Every push to main and every pull request: build, run the tests, and keep
#   the installer and the zip with the run (Actions → the run → Artifacts).
# - A version tag (git tag v0.2.0 && git push origin v0.2.0): the same, then a
#   GitHub Release with the installer and the zip attached. The tag must match
#   the version in CMakeLists.txt.
# - Or start it by hand: Actions → Windows build → Run workflow.
name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['README.md', '**/*.md']
  pull_request:
    paths-ignore: ['README.md', '**/*.md']
  workflow_dispatch:

# A newer push to the same branch makes the older build pointless.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # creating the release on a version tag

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: zip
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p
            qt6-base:p qt6-declarative:p qt6-tools:p
            mpv:p ffmpeg:p zlib:p nsis:p SDL2:p

      - name: Version
        id: version
        run: |
          VERSION=$(sed -n 's/^project(Relay VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Relay $VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
            echo "::error::The tag ${GITHUB_REF#refs/tags/} doesn't match the version in CMakeLists.txt ($VERSION)."
            exit 1
          fi
          # Every version needs its section in CHANGELOG.md (the release text).
          awk -v v="$VERSION" '/^## /{on = ($2 == v); next} on' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            msg="CHANGELOG.md has no section for $VERSION (## $VERSION)."
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "::error::$msg Add one before tagging."; exit 1; fi
            echo "::warning::$msg Add one before releasing."
          fi

      - name: Build and run the tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S . -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DRELAY_BUILD_TESTS=ON
          cmake --build build-tests
          # On a failure, run the tests again directly so every message shows.
          ctest --test-dir build-tests --output-on-failure --timeout 300 || {
            (cd build-tests && ./test_sources.exe -o -,txt 2>&1 | grep -v '^PASS' ; ./test_epg.exe 2>&1 | grep -v '^PASS')
            exit 1
          }

      - name: Package (zip and installer)
        run: ./packaging/package-windows.sh

      # The way Relay's updater runs it: quietly, over an installed copy. A
      # desktop shortcut you removed must stay removed.
      - name: Try the installer (install, quiet update, uninstall)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\Relay-*-setup.exe).FullName
          $dir = "$env:LOCALAPPDATA\Programs\Relay"
          $desk = [Environment]::GetFolderPath('Desktop') + '\Relay.lnk'
          Start-Process $setup -ArgumentList '/S' -Wait
          if (!(Test-Path "$dir\relay.exe") -or !(Test-Path "$dir\uninstall.exe")) { throw 'install: files missing' }
          if (!(Test-Path $desk)) { throw 'install: no desktop shortcut' }
          Remove-Item $desk
          Start-Process $setup -ArgumentList '/S' -Wait
          if (!(Test-Path "$dir\relay.exe")) { throw 'update: files missing' }
          if (Test-Path $desk) { throw 'update: the removed desktop shortcut came back' }
          # _?= keeps the uninstaller in place so -Wait really waits.
          Start-Process "$dir\uninstall.exe" -ArgumentList "/S _?=$dir" -Wait
          if (Test-Path "$dir\relay.exe") { throw 'uninstall: files left' }
          Write-Host 'Installer OK'

      - name: Keep the installer and the zip with this run
        uses: actions/upload-artifact@v6
        with:
          name: Relay-${{ steps.version.outputs.version }}-windows
          path: |
            dist/Relay-*-setup.exe
            dist/Relay-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish the release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Relay ${{ steps.version.outputs.version }}
          # This version's section of CHANGELOG.md (made in "Version").
          body_path: release-notes.md
          files: |
            dist/Relay-*-setup.exe
            dist/Relay-*-windows-x64.zip
